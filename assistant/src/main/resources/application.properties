# Server
server.port=8081

# Database (H2 in-memory for dev)
spring.datasource.url=jdbc:h2:mem:devopsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jenkins
jenkins.base-url=http://localhost:8080
jenkins.username=admin
jenkins.api-token=YOUR_JENKINS_API_TOKEN

# Groq
groq.api-key={ENTER YOUR API KEY HERE}

# Logging
logging.level.com.devops.assistant=DEBUG